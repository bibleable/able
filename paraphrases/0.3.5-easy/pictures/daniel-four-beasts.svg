<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 220" role="img" aria-labelledby="t d"><title id="t">Four beasts stand for four kings</title><desc id="d">Four rows connect each beast in Daniel’s vision to one king.</desc><rect width="370" height="220" rx="10" fill="#fff9ed"/><g font-family="sans-serif" font-size="18" fill="#253e38">
<circle cx="25" cy="31" r="14" fill="#d8e9e3"/><text x="25" y="37" text-anchor="middle">1</text><text x="48" y="37">Lion with wings</text><path d="M229 31h35m-8 -6 8 6-8 6" fill="none" stroke="#3b6556" stroke-width="3"/><text x="282" y="37">King 1</text>
<circle cx="25" cy="80" r="14" fill="#d8e9e3"/><text x="25" y="86" text-anchor="middle">2</text><text x="48" y="86">Bear</text><path d="M229 80h35m-8 -6 8 6-8 6" fill="none" stroke="#3b6556" stroke-width="3"/><text x="282" y="86">King 2</text>
<circle cx="25" cy="129" r="14" fill="#d8e9e3"/><text x="25" y="135" text-anchor="middle">3</text><text x="48" y="135">Leopard</text><path d="M229 129h35m-8 -6 8 6-8 6" fill="none" stroke="#3b6556" stroke-width="3"/><text x="282" y="135">King 3</text>
<circle cx="25" cy="178" r="14" fill="#d8e9e3"/><text x="25" y="184" text-anchor="middle">4</text><text x="48" y="184">Beast with ten horns</text><path d="M229 178h35m-8 -6 8 6-8 6" fill="none" stroke="#3b6556" stroke-width="3"/><text x="282" y="184">King 4</text>
</g></svg>
