<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 205" role="img" aria-labelledby="title desc">
<title id="title">Two squares seen from above</title>
<desc id="desc">The altar hearth is a square twelve cubits across. The surrounding ledge makes a larger square fourteen cubits across.</desc>
<rect width="300" height="205" rx="10" fill="#fff8eb"/>
<path d="M80 12h140v140H80z" fill="#dfc19c" stroke="#574838" stroke-width="2"/>
<path d="M90 22h120v120H90z" fill="#f3e2ca" stroke="#574838" stroke-width="2"/>
<g text-anchor="middle" font-family="sans-serif" font-size="16" fill="#332b25">
<text x="150" y="76">Hearth</text><text x="150" y="98">12 × 12 cubits</text>
<text x="150" y="185">Ledge: 14 × 14 cubits</text></g>
</svg>
