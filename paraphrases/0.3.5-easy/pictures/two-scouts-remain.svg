<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" role="img" aria-labelledby="title"><title id="title">Two scouts are named: Joshua son of Nun and Caleb son of Jephunneh.</title>
<rect width="380" height="180" rx="10" fill="#fff9ed"/>
<text x="90" y="33" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Scout</text><text x="280" y="33" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Father</text><rect x="10" y="49" width="360" height="47" rx="5" fill="#e4efe5" stroke="#486557" stroke-width="2"/><text x="90" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Joshua</text><text x="280" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Nun</text><rect x="10" y="111" width="360" height="47" rx="5" fill="#e4efe5" stroke="#486557" stroke-width="2"/><text x="90" y="142" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Caleb</text><text x="280" y="142" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Jephunneh</text>
</svg>
