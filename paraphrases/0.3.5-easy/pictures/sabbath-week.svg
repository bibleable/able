<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" role="img" aria-labelledby="title"><title id="title">Six days for work, then one day for rest</title>
<rect x="1" y="2" width="58" height="86" rx="5" fill="#faf3de"/>
<g font-family="sans-serif" text-anchor="middle" fill="#222"><text x="30" y="38" font-size="24">1</text><text x="30" y="67" font-size="17">Work</text></g>
<rect x="61" y="2" width="58" height="86" rx="5" fill="#faf3de"/>
<g font-family="sans-serif" text-anchor="middle" fill="#222"><text x="90" y="38" font-size="24">2</text><text x="90" y="67" font-size="17">Work</text></g>
<rect x="121" y="2" width="58" height="86" rx="5" fill="#faf3de"/>
<g font-family="sans-serif" text-anchor="middle" fill="#222"><text x="150" y="38" font-size="24">3</text><text x="150" y="67" font-size="17">Work</text></g>
<rect x="181" y="2" width="58" height="86" rx="5" fill="#faf3de"/>
<g font-family="sans-serif" text-anchor="middle" fill="#222"><text x="210" y="38" font-size="24">4</text><text x="210" y="67" font-size="17">Work</text></g>
<rect x="241" y="2" width="58" height="86" rx="5" fill="#faf3de"/>
<g font-family="sans-serif" text-anchor="middle" fill="#222"><text x="270" y="38" font-size="24">5</text><text x="270" y="67" font-size="17">Work</text></g>
<rect x="301" y="2" width="58" height="86" rx="5" fill="#faf3de"/>
<g font-family="sans-serif" text-anchor="middle" fill="#222"><text x="330" y="38" font-size="24">6</text><text x="330" y="67" font-size="17">Work</text></g>
<rect x="361" y="2" width="58" height="86" rx="5" fill="#e3edde"/>
<g font-family="sans-serif" text-anchor="middle" fill="#222"><text x="390" y="38" font-size="24">7</text><text x="390" y="67" font-size="17">Rest</text></g>
</svg>
