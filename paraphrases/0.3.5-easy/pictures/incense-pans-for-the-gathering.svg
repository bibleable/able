<rect x="15" y="14" width="350" height="43" rx="5" fill="#e4efe5" stroke="#486557" stroke-width="2"/><text x="190" y="44" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">250 men · one pan each</text><rect x="15" y="69" width="170" height="70" rx="5" fill="#e4efe5" stroke="#486557" stroke-width="2"/><text x="100" y="111" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Korah · one pan</text><rect x="196" y="69" width="169" height="70" rx="5" fill="#e4efe5" stroke="#486557" stroke-width="2"/><text x="280" y="111" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Aaron · one pan</text>
