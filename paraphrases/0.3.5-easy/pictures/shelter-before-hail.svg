<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-labelledby="title">
<title id="title">After the warning, servants and livestock move indoors before the hail.</title>
<rect width="360" height="180" rx="10" fill="#fff9ed"/>
<rect x="23" y="9" width="314" height="38" rx="5" fill="#e4efe6" stroke="#476655" stroke-width="2"/><text x="180" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253c31">Hear the warning</text><path d="M180 47v15l-5-5m5 5 5-5" fill="none" stroke="#3e5d4e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="23" y="67" width="314" height="38" rx="5" fill="#e4efe6" stroke="#476655" stroke-width="2"/><text x="180" y="93" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253c31">Bring people and animals inside</text><path d="M180 105v15l-5-5m5 5 5-5" fill="none" stroke="#3e5d4e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="23" y="125" width="314" height="38" rx="5" fill="#e4efe6" stroke="#476655" stroke-width="2"/><text x="180" y="151" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253c31">The hail falls</text>
</svg>
