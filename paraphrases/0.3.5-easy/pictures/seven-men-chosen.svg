<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 224" role="img"><title>The believers choose seven men and bring them to the apostles, who pray for them</title><rect x="16" y="8" width="288" height="48" rx="6" fill="#edf5f2" stroke="#24463c"/><text x="160" y="40" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#132d26">Believers choose seven men.</text><path d="M160 58 v23 m-7 -7 l7 7 7 -7" fill="none" stroke="#24463c" stroke-width="3"/><rect x="16" y="88" width="288" height="48" rx="6" fill="#edf5f2" stroke="#24463c"/><text x="160" y="120" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#132d26">They bring them to the apostles.</text><path d="M160 138 v23 m-7 -7 l7 7 7 -7" fill="none" stroke="#24463c" stroke-width="3"/><rect x="16" y="168" width="288" height="48" rx="6" fill="#edf5f2" stroke="#24463c"/><text x="160" y="200" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#132d26">The apostles pray for them.</text></svg>
