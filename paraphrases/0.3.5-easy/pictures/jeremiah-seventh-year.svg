<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 128" role="img" aria-labelledby="title desc">
  <title id="title">Freedom in the seventh year</title>
  <desc id="desc">Years one through six are grouped together as years of service. A separate box marks year seven, when the worker must go free.</desc>
  <rect width="390" height="128" fill="white"/>
  <g stroke-width="2">
    <rect x="12" y="16" width="230" height="96" rx="8" fill="#f7eedf" stroke="#61513e"/>
    <rect x="254" y="16" width="124" height="96" rx="8" fill="#e2f2ec" stroke="#325849"/>
  </g>
  <g text-anchor="middle" font-family="sans-serif" font-size="21" fill="#202820">
    <text x="127" y="55">Years 1 to 6</text><text x="127" y="91">Work</text>
    <text x="316" y="55">Year 7</text><text x="316" y="91">Go free</text>
  </g>
</svg>
