<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" role="img" aria-labelledby="title desc">
  <title id="title">The wall at half its planned height</title>
  <desc id="desc">Two equal bands. The upper band has a dashed outline. The lower band is solid stone.</desc>
  <rect width="440" height="200" fill="white"/>
  <rect x="20" y="20" width="200" height="80" fill="none" stroke="#383838" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="20" y="100" width="200" height="80" fill="#987358" stroke="#382e25" stroke-width="3"/>
  <path d="M20 140h200 M70 100v40 M170 100v40 M120 140v40" fill="none" stroke="#382e25" stroke-width="3"/>
  <g font-family="sans-serif" font-size="22" fill="#171717"><text x="240" y="68">Still to build</text><text x="240" y="148">Already built</text></g>
</svg>
