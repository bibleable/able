    <path d="M242 142V48c0-26-31-26-31-2"/>
  </g>
  <g text-anchor="middle" font-size="23" font-family="sans-serif" fill="#30291f">
    <text x="86" y="182">Favor</text><text x="234" y="182">Union</text>
  </g>
</svg>
