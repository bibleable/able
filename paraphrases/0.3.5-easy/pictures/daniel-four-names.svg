<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 206" role="img" aria-labelledby="title desc">
<title id="title">Four young men, each with two names</title>
<desc id="desc">Each row shows one man’s name in Judah and the name Ashpenaz gave him in Babylon.</desc>
<rect width="380" height="206" rx="8" fill="#fff9ed"/>
<g font-family="sans-serif" font-size="20" fill="#26382d">
<text x="24" y="32" font-weight="bold">In Judah</text><text x="185" y="32" font-weight="bold">In Babylon</text>
<text x="24" y="70">Daniel</text><text x="145" y="70">→</text><text x="185" y="70">Belteshazzar</text>
<text x="24" y="108">Hananiah</text><text x="145" y="108">→</text><text x="185" y="108">Shadrach</text>
<text x="24" y="146">Mishael</text><text x="145" y="146">→</text><text x="185" y="146">Meshach</text>
<text x="24" y="184">Azariah</text><text x="145" y="184">→</text><text x="185" y="184">Abednego</text>
</g></svg>
