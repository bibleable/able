<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 112" role="img" aria-labelledby="title">
  <title id="title">The firstborn son receives two shares for every one share another son receives</title>
  <rect width="310" height="112" rx="8" fill="#fffaf1"/>
  <g fill="#204537" font-family="sans-serif" font-size="18"><text x="12" y="39">Firstborn son</text><text x="12" y="88">Another son</text></g>
  <g fill="#b8d6bc" stroke="#294238" stroke-width="2"><rect x="170" y="13" width="37" height="37"/><rect x="218" y="13" width="37" height="37"/><rect x="170" y="62" width="37" height="37"/></g>
</svg>
