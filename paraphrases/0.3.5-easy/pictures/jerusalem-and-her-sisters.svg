<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img" aria-labelledby="title desc">
<title id="title">The three cities in the story</title>
<desc id="desc">Samaria is north of Jerusalem. Sodom is south of Jerusalem.</desc>
<rect width="360" height="210" rx="10" fill="#fff9ed"/>
<path d="M40 40v130" stroke="#466457" stroke-width="4"/>
<g fill="#365c4a"><circle cx="40" cy="40" r="10"/><circle cx="40" cy="105" r="10"/><circle cx="40" cy="170" r="10"/></g>
<g font-family="sans-serif" font-size="23" fill="#263f32"><text x="65" y="48">Samaria · north</text><text x="65" y="113" font-weight="bold">Jerusalem</text><text x="65" y="178">Sodom · south</text></g>
</svg>
