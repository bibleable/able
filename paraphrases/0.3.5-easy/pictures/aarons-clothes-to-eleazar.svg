<rect x="20" y="6" width="340" height="42" rx="5" fill="#e4efe5" stroke="#486557" stroke-width="2"/><text x="190" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Aaron wears the priestly clothes</text><path d="M190 48v13l-4-4m4 4 4-4" fill="none" stroke="#476356" stroke-width="3" stroke-linecap="round"/><rect x="20" y="65" width="340" height="42" rx="5" fill="#e4efe5" stroke="#486557" stroke-width="2"/><text x="190" y="93" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Moses passes the clothes on</text><path d="M190 107v13l-4-4m4 4 4-4" fill="none" stroke="#476356" stroke-width="3" stroke-linecap="round"/><rect x="20" y="124" width="340" height="42" rx="5" fill="#e4efe5" stroke="#486557" stroke-width="2"/><text x="190" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Eleazar wears them</text>
