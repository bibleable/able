<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" role="img" aria-labelledby="title desc">
  <title id="title">The measuring rod</title>
  <desc id="desc">Lines divide one rod into six equal lengths. Each length is one long cubit.</desc>
  <rect width="420" height="100" fill="white"/>
  <rect x="30" y="18" width="360" height="25" rx="2" fill="#d5ab73" stroke="#392919" stroke-width="3"/>
  <path d="M90 18v25m60-25v25m60-25v25m60-25v25m60-25v25" fill="none" stroke="#392919" stroke-width="3"/>
  <text x="210" y="77" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#29231b">1 rod = 6 long cubits</text>
</svg>
