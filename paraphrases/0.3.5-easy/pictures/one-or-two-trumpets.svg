<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" role="img" aria-labelledby="title"><title id="title">One trumpet calls the leaders. Two trumpets call the whole community.</title>
<rect width="380" height="180" rx="10" fill="#fff9ed"/>
<rect x="14" y="23" width="135" height="45" rx="5" fill="#e4efe5" stroke="#486557" stroke-width="2"/><text x="81" y="52" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">One trumpet</text><text x="263" y="52" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Leaders gather</text><rect x="14" y="99" width="135" height="45" rx="5" fill="#e4efe5" stroke="#486557" stroke-width="2"/><text x="81" y="128" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Two trumpets</text><text x="265" y="128" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Everyone gathers</text>
</svg>
