  <g fill="none" stroke="#694937" stroke-linecap="round">
    <path d="M165 166 Q160 112 152 87 L105 49 M152 88 Q180 88 202 68 L238 44" stroke-width="10"/>
    <path d="M165 164 Q156 181 127 198 M165 164 Q172 187 193 195 M165 164 L161 200" stroke-width="6"/>
  </g>
  <g fill="#507348"><ellipse cx="108" cy="45" rx="17" ry="6" transform="rotate(32 108 45)"/><ellipse cx="123" cy="60" rx="17" ry="6" transform="rotate(-26 123 60)"/><ellipse cx="230" cy="42" rx="17" ry="6" transform="rotate(-40 230 42)"/><ellipse cx="211" cy="60" rx="17" ry="6" transform="rotate(19 211 60)"/></g>
  <path d="M181 69l10 14m-5 -18 10 14" stroke="#335578" stroke-width="4"/>
