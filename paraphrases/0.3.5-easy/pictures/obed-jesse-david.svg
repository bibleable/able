<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" role="img" aria-labelledby="title">
<title id="title">Obed was the father of Jesse and the grandfather of David.</title>
<rect width="500" height="210" rx="12" fill="#fff9eb"/>
<g font-family="sans-serif" font-size="22" fill="#263c31">
<path d="M148 100h43m-10-9 11 9-11 9m126-9h44m-10-9 11 9-11 9" stroke="#496554" stroke-width="4" fill="none"/>
 <text x="62" y="108">Obed</text><text x="218" y="108">Jesse</text><text x="372" y="108">David</text>
 <text x="140" y="165">Each arrow points to a son.</text>
</g>
</svg>
