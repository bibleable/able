<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" role="img" aria-labelledby="title desc">
<title id="title">Water flows from Jerusalem in two directions</title>
<desc id="desc">One arrow points west from Jerusalem to the Western Sea. Another points east to the Eastern Sea.</desc>
