<circle cx="85" cy="73" r="22" fill="#46755c"/><text x="85" y="127" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#203a30">First</text><circle cx="190" cy="73" r="22" fill="#46755c"/><text x="190" y="127" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#203a30">Second</text><circle cx="295" cy="73" r="22" fill="#46755c"/><text x="295" y="127" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#203a30">Third</text>
</svg>
