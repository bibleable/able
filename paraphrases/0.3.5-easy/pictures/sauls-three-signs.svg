<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-labelledby="title">
  <title id="title">Three signs on Saul’s journey</title>
  <rect width="520" height="240" rx="12" fill="#fff9ed"/>
  <path d="M50 42v152" stroke="#477267" stroke-width="4"/>
  <g fill="#295348"><circle cx="50" cy="44" r="20"/><circle cx="50" cy="120" r="20"/><circle cx="50" cy="196" r="20"/></g>
  <g font-family="sans-serif" font-size="23">
    <g fill="white" text-anchor="middle"><text x="50" y="52">1</text><text x="50" y="128">2</text><text x="50" y="204">3</text></g>
    <g fill="#213e34"><text x="90" y="52">Two men give news of the donkeys.</text><text x="90" y="128">Three men give Saul two loaves.</text><text x="90" y="204">Saul speaks with the prophets.</text></g>
  </g>
</svg>
