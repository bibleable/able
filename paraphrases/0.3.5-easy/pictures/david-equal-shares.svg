<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" role="img" aria-labelledby="title">
<title id="title">Equal shares for two men who did different work</title>
<rect width="560" height="210" rx="14" fill="#fff9ed"/>
<g font-family="sans-serif" font-size="21" fill="#263d35" text-anchor="middle">
<text x="138" y="45">One man who fought</text><text x="416" y="45">One man who stayed</text><text x="416" y="71">with the supplies</text>
</g>
<g fill="#bee0ca" stroke="#325546" stroke-width="3"><rect x="58" y="102" width="160" height="56" rx="6"/><rect x="336" y="102" width="160" height="56" rx="6"/></g>
<g font-family="sans-serif" fill="#203d32" text-anchor="middle"><text x="138" y="139" font-size="23">One share</text><text x="277" y="141" font-size="34">=</text><text x="416" y="139" font-size="23">One share</text></g></svg>
