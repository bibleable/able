<text x="126" y="45" font-weight="bold">Fresh loaves</text><text x="126" y="72">The priests put them before the LORD.</text>
<text x="126" y="130" font-weight="bold">Loaves taken away</text><text x="126" y="157">Ahimelech gives them to David.</text>
