<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 157" role="img" aria-labelledby="title"><title id="title">Fourteen years of work for Laban’s daughters and six for the flocks make twenty years.</title>
<rect width="360" height="157" rx="10" fill="#fff9ed"/>
<text x="180" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#20372c">14 years for Laban’s daughters</text><rect x="14" y="45" width="19" height="19" fill="#41664f"/><rect x="38" y="45" width="19" height="19" fill="#41664f"/><rect x="62" y="45" width="19" height="19" fill="#41664f"/><rect x="86" y="45" width="19" height="19" fill="#41664f"/><rect x="110" y="45" width="19" height="19" fill="#41664f"/><rect x="134" y="45" width="19" height="19" fill="#41664f"/><rect x="158" y="45" width="19" height="19" fill="#41664f"/><rect x="182" y="45" width="19" height="19" fill="#41664f"/><rect x="206" y="45" width="19" height="19" fill="#41664f"/><rect x="230" y="45" width="19" height="19" fill="#41664f"/><rect x="254" y="45" width="19" height="19" fill="#41664f"/><rect x="278" y="45" width="19" height="19" fill="#41664f"/><rect x="302" y="45" width="19" height="19" fill="#41664f"/><rect x="326" y="45" width="19" height="19" fill="#41664f"/><text x="180" y="108" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#20372c">6 years for the flocks</text><rect x="14" y="120" width="19" height="19" fill="#41664f"/><rect x="38" y="120" width="19" height="19" fill="#41664f"/><rect x="62" y="120" width="19" height="19" fill="#41664f"/><rect x="86" y="120" width="19" height="19" fill="#41664f"/><rect x="110" y="120" width="19" height="19" fill="#41664f"/><rect x="134" y="120" width="19" height="19" fill="#41664f"/>
</svg>
