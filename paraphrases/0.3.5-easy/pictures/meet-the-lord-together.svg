<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" role="img" aria-labelledby="title"><title id="title">Those who died trusting Christ rise first. Then all his people meet him together.</title>
<rect width="380" height="180" rx="10" fill="#fff9ed"/>
<rect x="15" y="7" width="350" height="42" rx="6" fill="#e4efe6" stroke="#456552" stroke-width="2"/><text x="190" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#203a30">The dead in Christ rise</text><path d="M190 50v12l-4-4m4 4 4-4" stroke="#456552" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="15" y="66" width="350" height="42" rx="6" fill="#e4efe6" stroke="#456552" stroke-width="2"/><text x="190" y="94" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#203a30">Together all meet the Lord</text><path d="M190 109v12l-4-4m4 4 4-4" stroke="#456552" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="15" y="125" width="350" height="42" rx="6" fill="#e4efe6" stroke="#456552" stroke-width="2"/><text x="190" y="153" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#203a30">They stay with him</text>
</svg>
