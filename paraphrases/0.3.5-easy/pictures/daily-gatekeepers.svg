<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 160" role="img" aria-labelledby="title desc">
<title id="title">Guards on three sides each day</title>
<desc id="desc">Each dot stands for one guard. East has six, north has four, and south has four.</desc>
<rect width="390" height="160" rx="10" fill="#fff9ed"/>
<text x="18" y="42" fill="#253a33" font-family="sans-serif" font-size="22">East</text>
<circle cx="120" cy="35" r="10" fill="#2c6556"/>
<circle cx="160" cy="35" r="10" fill="#2c6556"/>
<circle cx="200" cy="35" r="10" fill="#2c6556"/>
<circle cx="240" cy="35" r="10" fill="#2c6556"/>
<circle cx="280" cy="35" r="10" fill="#2c6556"/>
<circle cx="320" cy="35" r="10" fill="#2c6556"/>
<text x="18" y="87" fill="#253a33" font-family="sans-serif" font-size="22">North</text>
<circle cx="120" cy="80" r="10" fill="#2c6556"/>
<circle cx="160" cy="80" r="10" fill="#2c6556"/>
<circle cx="200" cy="80" r="10" fill="#2c6556"/>
<circle cx="240" cy="80" r="10" fill="#2c6556"/>
<text x="18" y="132" fill="#253a33" font-family="sans-serif" font-size="22">South</text>
<circle cx="120" cy="125" r="10" fill="#2c6556"/>
<circle cx="160" cy="125" r="10" fill="#2c6556"/>
<circle cx="200" cy="125" r="10" fill="#2c6556"/>
<circle cx="240" cy="125" r="10" fill="#2c6556"/>
</svg>
