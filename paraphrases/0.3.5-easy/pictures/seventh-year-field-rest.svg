<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-labelledby="title">
<title id="title">Six years of growing crops lead to one year when the field rests.</title>
<rect width="360" height="180" rx="10" fill="#fff9ed"/>
<rect x="10" y="56" width="42" height="44" rx="5" fill="#dce9dd" stroke="#476655" stroke-width="2"/><text x="31" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253c31">1</text><rect x="59" y="56" width="42" height="44" rx="5" fill="#dce9dd" stroke="#476655" stroke-width="2"/><text x="80" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253c31">2</text><rect x="108" y="56" width="42" height="44" rx="5" fill="#dce9dd" stroke="#476655" stroke-width="2"/><text x="129" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253c31">3</text><rect x="157" y="56" width="42" height="44" rx="5" fill="#dce9dd" stroke="#476655" stroke-width="2"/><text x="178" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253c31">4</text><rect x="206" y="56" width="42" height="44" rx="5" fill="#dce9dd" stroke="#476655" stroke-width="2"/><text x="227" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253c31">5</text><rect x="255" y="56" width="42" height="44" rx="5" fill="#dce9dd" stroke="#476655" stroke-width="2"/><text x="276" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253c31">6</text><rect x="304" y="56" width="42" height="44" rx="5" fill="#f2d58a" stroke="#476655" stroke-width="2"/><text x="325" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253c31">7</text><text x="153" y="133" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253c31">Plant for six years</text><text x="322" y="133" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253c31">Rest</text>
</svg>
