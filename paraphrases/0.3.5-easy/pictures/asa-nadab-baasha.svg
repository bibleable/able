<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" role="img" aria-labelledby="title desc">
<title id="title">Two years during Asa’s reign</title><desc id="desc">Asa rules Judah in both years. In Israel, Nadab becomes king in Asa’s second year and Baasha becomes king in Asa’s third year.</desc>
<rect width="420" height="160" rx="9" fill="#fff9ed"/><rect x="122" y="55" width="285" height="39" rx="5" fill="#cde6dd"/><rect x="122" y="101" width="139" height="39" rx="5" fill="#eed8a7"/><rect x="268" y="101" width="139" height="39" rx="5" fill="#eed8a7"/>
<g font-family="sans-serif" font-size="18" fill="#302b25"><text x="191" y="37" text-anchor="middle">Asa’s year 2</text><text x="337" y="37" text-anchor="middle">Asa’s year 3</text><text x="14" y="82">In Judah</text><text x="14" y="128">In Israel</text><g text-anchor="middle" font-weight="bold"><text x="265" y="82">Asa</text><text x="191" y="128">Nadab</text><text x="337" y="128">Baasha</text></g></g></svg>
