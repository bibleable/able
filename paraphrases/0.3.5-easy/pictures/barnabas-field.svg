<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 224" role="img"><title>Barnabas sells his field and gives the money to the apostles</title><rect x="16" y="8" width="288" height="48" rx="6" fill="#edf5f2" stroke="#24463c"/><text x="160" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#132d26">He sells his field.</text><path d="M160 58 v23 m-7 -7 l7 7 7 -7" fill="none" stroke="#24463c" stroke-width="3"/><rect x="16" y="88" width="288" height="48" rx="6" fill="#edf5f2" stroke="#24463c"/><text x="160" y="120" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#132d26">He brings the money.</text><path d="M160 138 v23 m-7 -7 l7 7 7 -7" fill="none" stroke="#24463c" stroke-width="3"/><rect x="16" y="168" width="288" height="48" rx="6" fill="#edf5f2" stroke="#24463c"/><text x="160" y="200" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#132d26">He gives it to the apostles.</text></svg>
