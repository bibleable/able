    <g fill="#213e35"><text x="92" y="46">Samuel goes to Eli.</text><text x="92" y="106">Samuel goes to Eli again.</text><text x="92" y="166">Samuel goes to Eli a third time.</text><text x="92" y="226">Samuel answers the LORD.</text></g>
