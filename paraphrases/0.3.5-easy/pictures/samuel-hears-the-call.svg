<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 256" role="img" aria-labelledby="title">
  <title id="title">Samuel goes to Eli three times and then answers the LORD</title>
  <rect width="520" height="256" rx="12" fill="#fff9ed"/>
  <path d="M51 38v180" stroke="#427466" stroke-width="4"/>
  <g fill="#264e46"><circle cx="51" cy="38" r="20"/><circle cx="51" cy="98" r="20"/><circle cx="51" cy="158" r="20"/><circle cx="51" cy="218" r="20"/></g>
  <g font-family="sans-serif" font-size="24">
