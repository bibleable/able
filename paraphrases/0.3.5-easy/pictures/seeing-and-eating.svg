<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" width="320" height="190" role="img" aria-labelledby="title desc">
  <title id="title">What one believer sees at the meal</title>
  <desc id="desc">One believer feels free to eat. Another sees this and may eat even while believing it is wrong.</desc>
  <g fill="#edf5f2" stroke="#24463c" stroke-width="2">
    <rect x="10" y="6" width="300" height="40" rx="7"/>
    <rect x="10" y="72" width="300" height="40" rx="7"/>
    <rect x="10" y="138" width="300" height="44" rx="7"/>
  </g>
  <g fill="none" stroke="#24463c" stroke-width="3">
    <path d="M160 48v19m-5 -5 5 5 5 -5"/><path d="M160 114v19m-5 -5 5 5 5 -5"/>
  </g>
  <g fill="#152d25" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="160" y="32">One believer feels free to eat.</text>
    <text x="160" y="98">Another believer sees them eat.</text>
    <text x="160" y="156">That person may eat too,</text><text x="160" y="175">even while they have doubts.</text>
  </g>
</svg>
