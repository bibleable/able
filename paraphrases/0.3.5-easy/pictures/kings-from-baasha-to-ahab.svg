<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 264" role="img" aria-labelledby="title desc"><title id="title">Who ruled Israel next?</title><desc id="desc">Read from top to bottom. Baasha, Elah, Zimri, Omri, then Ahab ruled Israel.</desc><rect width="262" height="264" rx="9" fill="#fff9ed"/><g font-family="sans-serif" font-size="18" fill="#302b25"><text x="131" y="23" text-anchor="middle" font-weight="bold">Kings of Israel</text><rect x="56" y="34" width="150" height="30" rx="5" fill="#e8d8b8"/><text x="131" y="56" text-anchor="middle">Baasha</text><path d="M131 65v12m-5-5 5 5 5-5" fill="none" stroke="#435e51" stroke-width="2"/><rect x="56" y="81" width="150" height="30" rx="5" fill="#e8d8b8"/><text x="131" y="103" text-anchor="middle">Elah</text><path d="M131 112v12m-5-5 5 5 5-5" fill="none" stroke="#435e51" stroke-width="2"/><rect x="56" y="128" width="150" height="30" rx="5" fill="#e8d8b8"/><text x="131" y="150" text-anchor="middle">Zimri</text><path d="M131 159v12m-5-5 5 5 5-5" fill="none" stroke="#435e51" stroke-width="2"/><rect x="56" y="175" width="150" height="30" rx="5" fill="#e8d8b8"/><text x="131" y="197" text-anchor="middle">Omri</text><path d="M131 206v12m-5-5 5 5 5-5" fill="none" stroke="#435e51" stroke-width="2"/><rect x="56" y="222" width="150" height="30" rx="5" fill="#e8d8b8"/><text x="131" y="244" text-anchor="middle">Ahab</text></g></svg>
