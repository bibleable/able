<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" role="img" aria-labelledby="title">
  <title id="title">Hannah goes home and later returns to Shiloh with Samuel</title>
  <rect width="580" height="250" rx="15" fill="#fff9ef"/>
  <path d="M50 43v158" stroke="#536f63" stroke-width="5"/>
  <g fill="#295246"><circle cx="50" cy="44" r="18"/><circle cx="50" cy="122" r="18"/><circle cx="50" cy="200" r="18"/></g>
  <g font-family="sans-serif" fill="#253d33" font-size="23">
    <text x="88" y="36" font-weight="bold">Shiloh</text><text x="88" y="65">Hannah asks God for a son.</text>
    <text x="88" y="115" font-weight="bold">Ramah</text><text x="88" y="144">Hannah cares for Samuel at home.</text>
    <text x="88" y="193" font-weight="bold">Shiloh</text><text x="88" y="222">Hannah brings Samuel to Eli.</text>
  </g>
</svg>
