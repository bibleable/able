<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 235" role="img" aria-labelledby="title">
<title id="title">David’s two questions at Keilah and the LORD’s answers</title>
<rect width="540" height="235" rx="12" fill="#fff9ed"/>
<path d="M28 112h484" stroke="#b5c7bb" stroke-width="2"/>
<g font-family="sans-serif" font-size="21" fill="#243d35">
<text x="28" y="43" font-weight="bold">David asks</text><text x="175" y="43">Will Saul come?</text>
<text x="28" y="84" font-weight="bold">The LORD</text><text x="175" y="84">He will.</text>
<text x="28" y="153" font-weight="bold">David asks</text><text x="175" y="153">Will the people hand us over?</text>
<text x="28" y="194" font-weight="bold">The LORD</text><text x="175" y="194">They will.</text>
</g></svg>
