<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" role="img" aria-labelledby="title desc">
<title id="title">Two kingdoms and their next kings</title><desc id="desc">In Israel, Jeroboam’s son Nadab becomes king. In Judah, Rehoboam’s son Abijam becomes king.</desc>
<rect width="380" height="180" rx="10" fill="#fff9ed"/><path d="M190 15v150" stroke="#bcae99" stroke-width="2"/>
