<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 100" role="img" aria-labelledby="title">
  <title id="title">Seven dips in the Jordan River</title>
  <rect width="370" height="100" rx="10" fill="#edf7fa"/>
  <g text-anchor="middle" font-family="sans-serif" fill="#143e52">
    <text x="185" y="30" font-size="20">Seven dips in the Jordan</text>
    <circle cx="35" cy="66" r="19" fill="white" stroke="#246584" stroke-width="2"/>
    <text x="35" y="73" font-size="21">1</text>
    <circle cx="85" cy="66" r="19" fill="white" stroke="#246584" stroke-width="2"/>
    <text x="85" y="73" font-size="21">2</text>
    <circle cx="135" cy="66" r="19" fill="white" stroke="#246584" stroke-width="2"/>
    <text x="135" y="73" font-size="21">3</text>
    <circle cx="185" cy="66" r="19" fill="white" stroke="#246584" stroke-width="2"/>
    <text x="185" y="73" font-size="21">4</text>
    <circle cx="235" cy="66" r="19" fill="white" stroke="#246584" stroke-width="2"/>
    <text x="235" y="73" font-size="21">5</text>
    <circle cx="285" cy="66" r="19" fill="white" stroke="#246584" stroke-width="2"/>
    <text x="285" y="73" font-size="21">6</text>
    <circle cx="335" cy="66" r="19" fill="white" stroke="#246584" stroke-width="2"/>
    <text x="335" y="73" font-size="21">7</text>
  </g>
</svg>
