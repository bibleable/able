<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160" role="img">
  <title>First night: wet fleece, dry ground. Second night: dry fleece, wet ground.</title>
  <rect width="380" height="160" rx="8" fill="#fffaf1"/>
  <g fill="#d8eef7"><rect x="144" y="46" width="92" height="42" rx="6"/><rect x="260" y="100" width="100" height="42" rx="6"/></g>
  <g text-anchor="middle" font-family="sans-serif" fill="#213b42" font-size="20">
    <text x="190" y="32">Fleece</text><text x="310" y="32">Ground</text>
    <text x="70" y="74">First night</text><text x="190" y="74">Wet</text><text x="310" y="74">Dry</text>
    <text x="70" y="128">Second night</text><text x="190" y="128">Dry</text><text x="310" y="128">Wet</text>
  </g>
</svg>
