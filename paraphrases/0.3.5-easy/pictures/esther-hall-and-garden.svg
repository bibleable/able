<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" role="img" aria-labelledby="title desc">
  <title id="title">When the king leaves the feast</title>
  <desc id="desc">Esther and Haman stay in the banquet hall. The king goes to the palace garden.</desc>
  <rect x="4" y="4" width="190" height="142" rx="10" fill="#faf0db" stroke="#564333" stroke-width="2"/>
  <rect x="206" y="4" width="190" height="142" rx="10" fill="#e6efdf" stroke="#384f38" stroke-width="2"/>
  <g text-anchor="middle" font-family="sans-serif" font-size="18" fill="#252820">
    <text x="99" y="35" font-weight="bold">Banquet hall</text>
    <text x="301" y="35" font-weight="bold">Palace garden</text>
    <text x="99" y="126">Esther and Haman</text>
    <text x="301" y="126">The king</text>
  </g>
  <g stroke="#62462e" stroke-width="3" fill="#cfa477">
    <rect x="57" y="70" width="84" height="10" rx="2"/>
    <path d="M64 80v19m69-19v19" fill="none"/>
  </g>
  <path d="M301 98V77" stroke="#62462e" stroke-width="7"/>
  <path d="M281 81q-12-16 4-22 2-18 19-13 15-4 17 12 14 11 0 23z" fill="#66915f" stroke="#384f38" stroke-width="2"/>
</svg>
