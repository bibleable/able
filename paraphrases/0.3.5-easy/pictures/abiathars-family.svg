<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 240" role="img" aria-labelledby="title">
<title id="title">Three generations in Abiathar’s family</title>
<rect width="490" height="240" rx="14" fill="#fff9ed"/>
<path d="M44 43v150" stroke="#477267" stroke-width="4"/>
<g fill="#295348"><circle cx="44" cy="43" r="12"/><circle cx="44" cy="118" r="12"/><circle cx="44" cy="193" r="12"/></g>
<g font-family="sans-serif" font-size="23" fill="#243d35">
<text x="76" y="50">Ahitub — Abiathar’s grandfather</text>
<text x="76" y="125">Ahimelech — Abiathar’s father</text>
<text x="76" y="200">Abiathar — the son who escapes</text>
</g></svg>
