<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" role="img" aria-labelledby="title desc">
<title id="title">The water grows deeper</title>
<desc id="desc">Four equal measuring stops show increasing depth: ankles, knees, waist, then water too deep to walk through.</desc>
<rect width="480" height="180" rx="10" fill="#fff9ed"/>
<g fill="#9cceda" stroke="#325d6d" stroke-width="2">
<rect x="16" y="105" width="92" height="10"/><rect x="134" y="85" width="92" height="30"/>
<rect x="252" y="57" width="92" height="58"/><rect x="370" y="18" width="92" height="97"/>
</g>
<g font-family="sans-serif" fill="#243b43" text-anchor="middle" font-size="17">
<text x="62" y="142">Ankles</text><text x="180" y="142">Knees</text>
<text x="298" y="142">Waist</text><text x="416" y="142">Too deep</text><text x="416" y="163">to walk</text>
</g></svg>
