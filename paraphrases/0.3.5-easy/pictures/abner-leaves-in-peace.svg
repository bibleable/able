<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 185" role="img" aria-labelledby="title">
<title id="title">Abner visits David at Hebron and leaves in peace</title>
<rect width="520" height="185" rx="12" fill="#fff9ed"/>
<path d="M45 44v90" stroke="#416557" stroke-width="4"/>
<g fill="#2e5546"><circle cx="45" cy="44" r="15"/><circle cx="45" cy="134" r="15"/></g>
<g font-family="sans-serif" font-size="21" fill="#263d35"><text x="81" y="43" font-weight="bold">At Hebron</text><text x="81" y="72">David gives Abner and his men a feast.</text><text x="81" y="133" font-weight="bold">After the feast</text><text x="81" y="162">David lets Abner leave in peace.</text></g></svg>
