<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 189" role="img" aria-labelledby="title desc">
<title id="title">A different group serves each month</title><desc id="desc">Twelve boxes in order, one for each month. Each month has its own group of 24,000 men.</desc>
