<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" role="img">
  <title>Families west and east of the Jordan share the words “The LORD is God.”</title>
  <rect width="400" height="160" rx="8" fill="#fff8e8"/>
  <path d="M201 57q-12 20 0 39t0 40l-4 24" fill="none" stroke="#25718a" stroke-width="10"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#263628">
    <text x="200" y="36" font-size="24">The LORD is God.</text>
    <text x="93" y="95" font-size="19">Families west</text>
    <text x="307" y="95" font-size="19">Families east</text>
    <rect x="143" y="120" width="115" height="28" rx="4" fill="#e3f2f6"/>
    <text x="200" y="140" font-size="16">Jordan River</text>
  </g>
</svg>
