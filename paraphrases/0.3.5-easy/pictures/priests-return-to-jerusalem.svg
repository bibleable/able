<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 184" role="img" aria-labelledby="title desc">
  <title id="title">Two journeys</title>
  <desc id="desc">Zadok and Abiathar take the ark back to Jerusalem. David goes up the Mount of Olives.</desc>
  <rect width="420" height="184" rx="10" fill="#fff9ed"/>
  <g stroke="#423b31" stroke-width="3" stroke-linejoin="round">
    <path d="M16 68V27h10v8h9v-8h10v8h9v-8h10v41H48V52a8 8 0 0 0-16 0v16Z" fill="#dbbc91"/>
    <path d="m9 154 32-43 33 43Z" fill="#90ac7d"/>
  </g>
  <path d="M14 92h392" stroke="#b4aa98" stroke-width="2"/>
  <g fill="#302b25" font-family="sans-serif" font-size="20">
    <text x="90" y="38">Zadok and Abiathar take the ark</text><text x="90" y="65">back to Jerusalem.</text>
    <text x="90" y="128">David goes up</text><text x="90" y="155">the Mount of Olives.</text>
  </g>
</svg>
