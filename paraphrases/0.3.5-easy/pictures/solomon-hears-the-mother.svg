<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-labelledby="title desc">
  <title id="title">The mother speaks and Solomon answers</title>
  <desc id="desc">The mother asks for her baby to live. Solomon orders that the living baby go to her.</desc>
  <rect width="400" height="200" rx="12" fill="#fff9ed"/>
  <g stroke="#41392f" stroke-width="2.5" stroke-linejoin="round">
    <circle cx="45" cy="36" r="12" fill="#b78560"/>
    <path d="M37 48q-14 5-15 30h47q-1-22-18-30Z" fill="#719a9a"/>
    <circle cx="45" cy="132" r="12" fill="#986c4b"/>
    <path d="M33 122l-1-12 9 5 5-9 6 9 8-6-2 14Z" fill="#dcad50"/>
    <path d="M37 145q-14 5-15 30h47q-1-22-18-30Z" fill="#92739b"/>
  </g>
  <path d="M18 96h364" stroke="#bcae99" stroke-width="2"/>
  <g font-family="sans-serif" font-size="20" fill="#302b25">
    <text x="88" y="40" font-weight="bold">The mother asks</text><text x="88" y="69">Let my baby live.</text>
    <text x="88" y="137" font-weight="bold">Solomon decides</text><text x="88" y="166">Give the baby to his mother.</text>
  </g>
</svg>
