<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 208" role="img" aria-labelledby="title">
<title id="title">Which king does each leader serve?</title>
<rect width="540" height="208" rx="12" fill="#fff9ed"/>
<g fill="#d6e9df" stroke="#36584b" stroke-width="2"><rect x="18" y="20" width="244" height="168" rx="9"/><rect x="278" y="20" width="244" height="168" rx="9"/></g>
<g text-anchor="middle" font-family="sans-serif" font-size="22" fill="#243d34">
<text x="140" y="70" font-weight="bold">King David</text><text x="140" y="116">Joab leads</text><text x="140" y="146">his men.</text>
<text x="400" y="70" font-weight="bold">King Ish-bosheth</text><text x="400" y="116">Abner leads</text><text x="400" y="146">his men.</text></g></svg>
