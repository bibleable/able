<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 285" role="img" aria-labelledby="title desc">
<title id="title">Three portions of land</title>
<desc id="desc">Three strips have the same length. The priests and Levites each have a strip ten thousand cubits wide. The city strip is half as wide.</desc>
<rect width="320" height="285" rx="10" fill="#fff9ed"/>
<g stroke="#53493b" stroke-width="2">
<rect x="45" y="28" width="230" height="92" fill="#d9e7cd"/>
<rect x="45" y="120" width="230" height="92" fill="#e0e8ed"/>
<rect x="45" y="212" width="230" height="46" fill="#ead6b7"/>
</g>
<g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#2c302a">
<text x="160" y="21">25,000 cubits long</text>
<text x="160" y="70">Priests</text><text x="160" y="94">10,000 cubits wide</text>
<text x="160" y="162">Levites</text><text x="160" y="186">10,000 cubits wide</text>
<text x="160" y="241">City · 5,000 cubits wide</text>
</g></svg>
