<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" role="img" aria-labelledby="title"><title id="title">A longer bar stands for a larger share of land. A shorter bar stands for a smaller share.</title>
<rect width="380" height="180" rx="10" fill="#fff9ed"/>
<text x="95" y="57" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Larger tribe</text><rect x="165" y="29" width="193" height="41" rx="5" fill="#e4efe5" stroke="#486557" stroke-width="2"/><text x="95" y="132" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243a31">Smaller tribe</text><rect x="165" y="104" width="88" height="41" rx="5" fill="#e4efe5" stroke="#486557" stroke-width="2"/>
</svg>
