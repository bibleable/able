<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 92" role="img" aria-labelledby="title"><title id="title">Seven numbered marks stand for the seven lambs Abraham sets apart.</title>
<rect width="360" height="92" rx="10" fill="#fff9ed"/>
<circle cx="36" cy="46" r="18" fill="#e4efe7" stroke="#41664f"/><text x="36" y="53" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#20372c">1</text><circle cx="84" cy="46" r="18" fill="#e4efe7" stroke="#41664f"/><text x="84" y="53" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#20372c">2</text><circle cx="132" cy="46" r="18" fill="#e4efe7" stroke="#41664f"/><text x="132" y="53" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#20372c">3</text><circle cx="180" cy="46" r="18" fill="#e4efe7" stroke="#41664f"/><text x="180" y="53" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#20372c">4</text><circle cx="228" cy="46" r="18" fill="#e4efe7" stroke="#41664f"/><text x="228" y="53" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#20372c">5</text><circle cx="276" cy="46" r="18" fill="#e4efe7" stroke="#41664f"/><text x="276" y="53" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#20372c">6</text><circle cx="324" cy="46" r="18" fill="#e4efe7" stroke="#41664f"/><text x="324" y="53" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#20372c">7</text>
