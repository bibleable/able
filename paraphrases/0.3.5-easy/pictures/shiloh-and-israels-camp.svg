<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" role="img" aria-labelledby="title">
  <title id="title">The ark goes to camp. The messenger returns to Shiloh.</title>
  <rect width="580" height="220" rx="14" fill="#fff8e9"/>
  <g text-anchor="middle" font-family="sans-serif" fill="#223e34" font-size="23">
    <text x="90" y="117" font-weight="bold">Shiloh</text>
    <text x="480" y="117" font-weight="bold">Israel’s camp</text>
    <text x="290" y="39">Men carry the ark</text>
    <text x="290" y="195">A messenger runs back</text>
  </g>
  <g fill="none" stroke="#356c62" stroke-width="5" stroke-linejoin="round">
    <path d="M93 84V62h385v21m-10-12 10 13 10-13"/>
    <path d="M478 131v24H93v-21m-10 12 10-13 10 13"/>
  </g>
</svg>
