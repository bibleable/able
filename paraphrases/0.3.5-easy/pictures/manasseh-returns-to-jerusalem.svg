<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" role="img" aria-labelledby="title desc">
  <title id="title">Manasseh goes away and returns</title>
  <desc id="desc">The top arrow shows captivity from Jerusalem to Babylon. The bottom arrow shows his return to Jerusalem after prayer.</desc>
  <rect width="420" height="170" rx="12" fill="#fff8ea"/>
  <g font-family="sans-serif" fill="#243c34" text-anchor="middle">
    <text x="75" y="87" font-size="22">Jerusalem</text><text x="348" y="87" font-size="22">Babylon</text>
    <text x="210" y="35" font-size="19">Taken captive</text><text x="210" y="150" font-size="19">Brought home</text>
  </g>
  <g fill="none" stroke="#465e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 59 Q210 37 340 59 M327 49 L340 59 L324 65"/>
    <path d="M340 104 Q210 126 80 104 M93 114 L80 104 L96 98"/>
  </g>
</svg>
